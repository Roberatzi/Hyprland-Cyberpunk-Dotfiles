general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    color = rgb(080b12)
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(27e8f4)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgb(27e8f4)
    inner_color = rgb(080b12)
    font_color = rgb(d8e6f2)
    fade_on_empty = false
    placeholder_text = <i>PASSCODE REQUIRED</i>
    check_color = rgb(b18aff)
    fail_color = rgb(ff5277)
    position = 0, -20
    halign = center
    valign = center
}
